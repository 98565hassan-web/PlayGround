<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#04050c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>PAC-MAN: Memory Maze</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23070b18'/%3E%3Cpath d='M32 32 56 22a26 26 0 1 0 0 20Z' fill='%23ffdf3d'/%3E%3Ccircle cx='28' cy='24' r='3' fill='%23070b18'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="hud">
      <div class="hud-cell">
        <span class="hud-label">SCORE</span>
        <strong id="score">0</strong>
      </div>
      <div class="brand">
        <span class="brand-main">PAC-MAN</span>
        <span class="brand-sub">MEMORY MAZE</span>
      </div>
      <div class="hud-cell hud-right">
        <span class="hud-label">HIGH</span>
        <strong id="high">0</strong>
      </div>
    </header>

    <div id="meta">
      <div id="lives" class="lives" aria-label="Lives remaining"></div>
      <button id="memoryBtn" class="memory" type="button" aria-pressed="false" title="Reveal the ghosts' learned route">
        <span class="memory-label">GHOST MEMORY</span>
        <span class="memory-track"><span id="memoryFill"></span></span>
        <span id="memoryPct">0%</span>
      </button>
      <div class="level-chip">LVL <b id="level">01</b></div>
    </div>

    <main id="stage">
      <div class="stage-grid" aria-hidden="true"></div>
      <canvas id="game" aria-label="Pac-Man maze. Swipe to steer, or use the direction pad below."></canvas>
      <div id="overlay" class="overlay"></div>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
      <div id="tiltBadge" class="tilt-badge" aria-hidden="true">TILT ACTIVE</div>
    </main>

    <footer id="controls">
      <div id="dpad" class="dpad" aria-label="Direction controls">
        <button type="button" data-dir="up" aria-label="Move up">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 14.5 12 8l6 6.5"/></svg>
        </button>
        <button type="button" data-dir="left" aria-label="Move left">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6 8 12l6.5 6"/></svg>
        </button>
        <div class="dpad-center" aria-hidden="true"></div>
        <button type="button" data-dir="right" aria-label="Move right">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 6 16 12l-6.5 6"/></svg>
        </button>
        <button type="button" data-dir="down" aria-label="Move down">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9.5 12 16l6-6.5"/></svg>
        </button>
      </div>

      <div class="actions">
        <button id="tiltBtn" class="action" type="button" aria-pressed="false" aria-label="Toggle accelerometer tilt controls" title="Accelerometer tilt. iOS asks for motion access when you enable it.">
          <span>TILT</span><small id="tiltState">OFF</small>
        </button>
        <button id="soundBtn" class="action on" type="button" aria-pressed="true" aria-label="Toggle sound">
          <span>SOUND</span><small id="soundState">ON</small>
        </button>
        <button id="pauseBtn" class="action" type="button" aria-label="Pause game">
          <span>PAUSE</span><small>P</small>
        </button>
      </div>
    </footer>
  </div>

  <script src="maze.js"></script>
  <script src="audio.js"></script>
  <script src="ai.js"></script>
  <script src="render.js"></script>
  <script src="engine.js"></script>
  <script src="game.js"></script>
</body>
</html>
